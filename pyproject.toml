[project]
name = "offres"
version = "0.1.0"
description = "Offres d'emploi publiques (service public, France Travail) : collecte, extraction des compétences (NLP) et dashboard"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.20,<3",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
offres = "offres.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 130
target-version = "py311"
