name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest -q
      # Un workflow invalide échoue sans rien exécuter ni prévenir : on les vérifie ici
      - run: pip install actionlint-py && actionlint -shellcheck= .github/workflows/*.yml
