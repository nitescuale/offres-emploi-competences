name: Offres Choisir le service public

# Chaque lundi : offres d'emploi des trois fonctions publiques (open data DGAFP), un CSV par année depuis 2022,
# normalisées et consolidées en un seul Parquet (une ligne par offre) publié dans la release `donnees` :
# csp_offres.parquet, csp_rapport.json. Aucune clé d'API nécessaire.
on:
  push:
    branches: [main]
    paths:
      - "src/offres/csp.py"
      - ".github/workflows/csp.yml"
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write

# Les trois workflows de données écrivent dans la même release : jamais deux à la fois
concurrency:
  group: release-donnees
  cancel-in-progress: false

jobs:
  csp:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - name: Télécharger et consolider (refuse de publier un fichier amputé d'une année)
        run: |
          gh release download donnees -p csp_rapport.json -D precedent 2>/dev/null || echo "Pas de rapport précédent"
          offres --dossier donnees csp --rapport-precedent precedent/csp_rapport.json
      - name: Publier dans la release
        run: |
          gh release view donnees >/dev/null 2>&1 || gh release create donnees --target main --latest=false \
            --title "Données collectées" --notes "Offres d'emploi (Parquet) et référentiels, mis à jour par les workflows du dépôt."
          cd donnees/csp && for f in *; do mv "$f" "csp_$f"; done
          gh release upload donnees ./* --clobber
          # Anciens fichiers bruts par année, remplacés par le fichier consolidé
          for a in $(gh release view donnees --json assets -q '.assets[].name' | grep '^csp_offres_datagouv_' || true); do
            gh release delete-asset donnees "$a" --yes
          done
