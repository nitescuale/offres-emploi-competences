name: Modèles d'embeddings

# Copie des modèles de phrases utilisés pour l'extraction des compétences (étape 4) dans la release `modeles`,
# pour pouvoir les charger là où Hugging Face n'est pas joignable. Licences : MIT (e5), Apache 2.0 (MiniLM).
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/modeles.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  modeles:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "huggingface_hub>=0.24"
      - name: Télécharger les modèles
        run: |
          python - <<'PY'
          from huggingface_hub import snapshot_download
          for depot in ["intfloat/multilingual-e5-small", "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"]:
              dossier = snapshot_download(depot, local_dir=f"modeles/{depot.split('/')[1]}",
                                          allow_patterns=["*.json", "*.txt", "*.model", "model.safetensors", "1_Pooling/*",
                                                          "sentencepiece.bpe.model", "README.md", "LICENSE"])
              print(depot, "->", dossier)
          PY
          cd modeles && for d in */; do tar czf "${d%/}.tar.gz" "$d"; ls -la "${d%/}.tar.gz"; done
      - name: Publier dans la release modeles
        run: |
          gh release view modeles >/dev/null 2>&1 || gh release create modeles --target main --latest=false \
            --title "Modèles d'embeddings" --notes "Copies de modèles de phrases publics (Hugging Face) utilisés par l'étape 4."
          gh release upload modeles modeles/*.tar.gz --clobber
